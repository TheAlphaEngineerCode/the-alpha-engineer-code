<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">William Oliveira — Software Engineer</title>
  <desc id="description">A dark blue and orange banner for a software engineer building trustworthy systems.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0d1b2e" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18" />
      <stop offset="0.52" stop-color="#ffb347" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="orangeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity="0.32" />
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <circle cx="1035" cy="45" r="250" fill="url(#blueGlow)" />
    <circle cx="880" cy="290" r="235" fill="url(#orangeGlow)" />

    <g fill="none" stroke-linecap="round">
      <path d="M 790 244 C 845 160, 925 138, 1012 181 S 1145 203, 1225 93" stroke="#38bdf8" stroke-opacity="0.34" stroke-width="2" />
      <path d="M 760 274 C 846 207, 909 226, 965 148 S 1090 71, 1215 132" stroke="#ff9b38" stroke-opacity="0.4" stroke-width="2" />
      <path d="M 840 62 C 890 105, 960 100, 1008 67 S 1110 33, 1194 82" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="1.5" />
    </g>

    <g filter="url(#softGlow)">
      <circle cx="790" cy="244" r="5" fill="#38bdf8" />
      <circle cx="925" cy="160" r="5" fill="#38bdf8" />
      <circle cx="1012" cy="181" r="5" fill="#38bdf8" />
      <circle cx="1145" cy="203" r="5" fill="#38bdf8" />
      <circle cx="846" cy="207" r="5" fill="#ff9b38" />
      <circle cx="965" cy="148" r="5" fill="#ff9b38" />
      <circle cx="1090" cy="71" r="5" fill="#ff9b38" />
    </g>

    <rect x="64" y="57" width="72" height="5" rx="2.5" fill="url(#accent)" />
    <text x="64" y="130" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.5">
      William Oliveira
    </text>
    <text x="66" y="172" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="0.8">
      SOFTWARE ENGINEER · TRUSTWORTHY SYSTEMS
    </text>
    <text x="66" y="218" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">
      Developer infrastructure · Application security · AI systems · Automation
    </text>

    <g transform="translate(66 250)">
      <rect width="186" height="34" rx="17" fill="#172a42" stroke="#38bdf8" stroke-opacity="0.35" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="34" y="22" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
        EVIDENCE-DRIVEN
      </text>
    </g>

    <g transform="translate(264 250)">
      <rect width="168" height="34" rx="17" fill="#2a211a" stroke="#ff9b38" stroke-opacity="0.42" />
      <circle cx="20" cy="17" r="5" fill="#ff9b38" />
      <text x="34" y="22" fill="#ffedd5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
        OPEN SOURCE
      </text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
